[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sviscan"
version = "0.1.0"
description = "SVI vol-surface fitting and no-arbitrage scanning on live option chains"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hemang" }]
keywords = ["svi", "volatility-surface", "arbitrage", "options", "gatheral"]
dependencies = ["numpy>=1.26", "scipy>=1.11", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
sviscan = "sviscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sviscan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "slow: long-running calibration gate (reported but non-blocking)",
]
